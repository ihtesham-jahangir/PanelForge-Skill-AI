  <text x="105" y="455" fill="#64748b" font-family="sans-serif" font-size="11">DATE</text><text x="315" y="455" fill="#64748b" font-family="sans-serif" font-size="11">DESCRIPTION</text><text x="555" y="455" fill="#64748b" font-family="sans-serif" font-size="11">AMOUNT</text><text x="680" y="455" fill="#64748b" font-family="sans-serif" font-size="11">STATUS</text>
  <path d="M100 470 H730 M100 520 H730 M100 570 H730" stroke="#e2e8f0"/>
  <text x="105" y="500" fill="#0f172a" font-family="sans-serif" font-size="14">Oct 30</text><text x="315" y="500" fill="#0f172a" font-family="sans-serif" font-size="14">Scale plan</text><text x="555" y="500" fill="#0f172a" font-family="sans-serif" font-size="14">$499</text><text x="680" y="500" fill="#16a34a" font-family="sans-serif" font-size="14">Paid</text>
  <text x="105" y="550" fill="#0f172a" font-family="sans-serif" font-size="14">Sep 30</text><text x="315" y="550" fill="#0f172a" font-family="sans-serif" font-size="14">Scale plan</text><text x="555" y="550" fill="#0f172a" font-family="sans-serif" font-size="14">$499</text><text x="680" y="550" fill="#16a34a" font-family="sans-serif" font-size="14">Paid</text>
  <rect x="805" y="370" width="327" height="245" rx="20" fill="#ecfdf5"/><text x="840" y="415" fill="#065f46" font-family="sans-serif" font-size="20" font-weight="700">Payment method</text><text x="840" y="470" fill="#064e3b" font-family="sans-serif" font-size="16">◉ Visa ending 4242</text><text x="840" y="510" fill="#64748b" font-family="sans-serif" font-size="14">Expires 08/29</text><rect x="840" y="545" width="170" height="40" rx="8" fill="#047857"/><text x="875" y="570" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">Update method</text>
