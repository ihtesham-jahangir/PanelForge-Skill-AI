<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Billing and subscriptions dashboard</title>
  <desc id="desc">A SaaS billing dashboard showing plan, usage, invoices, payment method, and subscription controls.</desc>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <text x="68" y="75" fill="#0f172a" font-family="sans-serif" font-size="30" font-weight="700">Billing &amp; subscriptions</text>
