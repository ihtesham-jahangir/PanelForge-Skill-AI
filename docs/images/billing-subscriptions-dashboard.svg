  <rect x="68" y="145" width="510" height="190" rx="20" fill="#172554"/>
  <text x="102" y="190" fill="#bfdbfe" font-family="sans-serif" font-size="13">CURRENT PLAN</text><text x="102" y="240" fill="#fff" font-family="sans-serif" font-size="32" font-weight="700">Scale</text><text x="102" y="278" fill="#cbd5e1" font-family="sans-serif" font-size="15">$499 / month · Renews Nov 30</text>
  <rect x="405" y="185" width="130" height="44" rx="9" fill="#60a5fa"/><text x="435" y="213" fill="#172554" font-family="sans-serif" font-size="13" font-weight="700">Change plan</text>
