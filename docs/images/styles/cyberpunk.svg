<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Cyberpunk dashboard example</title>
  <desc id="desc">A PanelForge admin dashboard reference showing the Cyberpunk visual style: Technical energy.</desc>
  <defs>
    <linearGradient id="wash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#100b2e"/>
      <stop offset="1" stop-color="#1d1549"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1200" height="700" rx="28" fill="url(#wash)"/>
  <rect x="34" y="34" width="1132" height="632" rx="20" fill="#1d1549" stroke="#ff2bd6" stroke-opacity=".16"/>
  <rect x="34" y="34" width="215" height="632" rx="20" fill="#ff2bd6" fill-opacity=".92"/>
  <text x="66" y="88" fill="#1d1549" font-family="Arial,sans-serif" font-size="21" font-weight="700">PANELFORGE</text>
  <text x="66" y="126" fill="#1d1549" fill-opacity=".65" font-family="Arial,sans-serif" font-size="13">Cyberpunk</text>
  <g fill="#1d1549" fill-opacity=".78" font-family="Arial,sans-serif" font-size="15">
    <text x="66" y="190">Overview</text><text x="66" y="234">Analytics</text>
    <text x="66" y="278">Customers</text><text x="66" y="322">Billing</text>
    <text x="66" y="366">Audit log</text>
  </g>
  <rect x="276" y="68" width="846" height="56" rx="14" fill="#100b2e" fill-opacity=".74"/>
  <circle cx="311" cy="96" r="13" fill="#ff2bd6" fill-opacity=".86"/>
  <text x="342" y="103" fill="#ff2bd6" font-family="Arial,sans-serif" font-size="22" font-weight="700">Operations overview</text>
  <circle cx="1070" cy="96" r="17" fill="#ff2bd6" fill-opacity=".15"/>
  <text x="1092" y="102" fill="#ff2bd6" font-family="Arial,sans-serif" font-size="14">Admin</text>
  <g filter="url(#shadow)">
    <rect x="276" y="152" width="196" height="112" rx="16" fill="#1d1549" stroke="#ff2bd6" stroke-opacity=".12"/>
    <rect x="492" y="152" width="196" height="112" rx="16" fill="#1d1549" stroke="#ff2bd6" stroke-opacity=".12"/>
    <rect x="708" y="152" width="196" height="112" rx="16" fill="#1d1549" stroke="#ff2bd6" stroke-opacity=".12"/>
    <rect x="924" y="152" width="198" height="112" rx="16" fill="#ff2bd6" fill-opacity=".92"/>
  </g>
  <g font-family="Arial,sans-serif">
    <g fill="#ff2bd6" font-size="13" opacity=".72"><text x="298" y="183">Active users</text><text x="514" y="183">Conversion</text><text x="730" y="183">Revenue</text></g>
    <g fill="#ff2bd6" font-size="29" font-weight="700"><text x="298" y="226">12,842</text><text x="514" y="226">8.46%</text><text x="730" y="226">$48.2k</text></g>
    <text x="946" y="183" fill="#1d1549" fill-opacity=".7" font-size="13">Health score</text>
    <text x="946" y="226" fill="#1d1549" font-size="29" font-weight="700">98.4</text>
  </g>
  <rect x="276" y="292" width="500" height="330" rx="16" fill="#1d1549" stroke="#ff2bd6" stroke-opacity=".12"/>
  <text x="302" y="330" fill="#ff2bd6" font-family="Arial,sans-serif" font-size="18" font-weight="700">Weekly performance</text>
  <g stroke="#ff2bd6" stroke-opacity=".1"><path d="M302 382H748M302 438H748M302 494H748M302 550H748"/></g>
  <path d="M304 532 C360 500 382 510 424 458 S490 462 530 422 S592 452 632 382 S698 406 748 350" fill="none" stroke="#ff2bd6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="748" cy="350" r="8" fill="#ff2bd6"/>
  <rect x="800" y="292" width="322" height="330" rx="16" fill="#1d1549" stroke="#ff2bd6" stroke-opacity=".12"/>
  <text x="826" y="330" fill="#ff2bd6" font-family="Arial,sans-serif" font-size="18" font-weight="700">Recent activity</text>
  <g font-family="Arial,sans-serif" font-size="14" fill="#ff2bd6">
    <circle cx="832" cy="378" r="7" fill="#ff2bd6"/><text x="854" y="383">Role updated</text><text x="854" y="404" opacity=".58">2 minutes ago</text>
    <circle cx="832" cy="450" r="7" fill="#ff2bd6" fill-opacity=".7"/><text x="854" y="455">Invoice paid</text><text x="854" y="476" opacity=".58">18 minutes ago</text>
    <circle cx="832" cy="522" r="7" fill="#ff2bd6" fill-opacity=".45"/><text x="854" y="527">New workspace</text><text x="854" y="548" opacity=".58">1 hour ago</text>
  </g>
  <text x="276" y="652" fill="#ff2bd6" fill-opacity=".6" font-family="Arial,sans-serif" font-size="12">Technical energy · accessible fallback · responsive layout</text>
</svg>
