    <rect x="720" y="450" width="435" height="175" rx="15" fill="#0f172a"/><text x="745" y="490" fill="#fff" font-size="18" font-weight="700">Notification center</text><text x="745" y="530" fill="#cbd5e1" font-size="14">● 3 access reviews need attention</text><text x="745" y="560" fill="#cbd5e1" font-size="14">● New invitation accepted</text><text x="745" y="590" fill="#94a3b8" font-size="14">View audit activity →</text>
