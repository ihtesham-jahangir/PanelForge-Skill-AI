  <text x="265" y="60" fill="#0f172a" font-family="sans-serif" font-size="28" font-weight="700">Workspace administration</text>
  <rect x="1030" y="35" width="125" height="42" rx="9" fill="#2563eb"/>
  <text x="1053" y="62" fill="#fff" font-family="sans-serif" font-size="13" font-weight="700">Invite user</text>
  <g font-family="sans-serif">
