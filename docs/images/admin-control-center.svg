    <path d="M290 330 H1130 M290 370 H1130" stroke="#e2e8f0"/>
    <text x="295" y="355" fill="#0f172a" font-size="14">Maya Chen</text><text x="580" y="355" fill="#0f172a" font-size="14">Manager</text><text x="750" y="355" fill="#475569" font-size="14">Full workspace</text><text x="1035" y="355" fill="#16a34a" font-size="14">Active</text>
    <text x="295" y="395" fill="#0f172a" font-size="14">Jon Bell</text><text x="580" y="395" fill="#0f172a" font-size="14">Member</text><text x="750" y="395" fill="#475569" font-size="14">CRM only</text><text x="1035" y="395" fill="#16a34a" font-size="14">Active</text>
