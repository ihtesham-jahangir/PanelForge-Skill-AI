    <rect x="490" y="100" width="205" height="105" rx="15" fill="#dcfce7"/><text x="515" y="135" fill="#166534" font-size="12">ROLES ASSIGNED</text><text x="515" y="178" fill="#14532d" font-size="32" font-weight="700">06</text>
    <rect x="715" y="100" width="205" height="105" rx="15" fill="#fef3c7"/><text x="740" y="135" fill="#92400e" font-size="12">PENDING INVITES</text><text x="740" y="178" fill="#451a03" font-size="32" font-weight="700">12</text>
    <rect x="940" y="100" width="215" height="105" rx="15" fill="#fce7f3"/><text x="965" y="135" fill="#9d174d" font-size="12">ALERTS</text><text x="965" y="178" fill="#831843" font-size="32" font-weight="700">03</text>
    <rect x="265" y="235" width="890" height="185" rx="15" fill="#fff" stroke="#e2e8f0"/>
