<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Admin control center dashboard</title>
  <desc id="desc">An admin dashboard showing organization switcher, users, roles, permissions, notifications, and settings.</desc>
  <rect width="1200" height="680" rx="28" fill="#f8fafc"/>
  <rect width="225" height="680" rx="28" fill="#111827"/>
