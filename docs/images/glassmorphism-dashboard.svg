<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Glassmorphism dashboard example</title>
  <desc id="desc">A dark gradient dashboard with translucent glass cards and revenue metrics.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#312e81"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <circle cx="950" cy="80" r="160" fill="#22d3ee" opacity=".22" filter="url(#blur)"/>
  <circle cx="220" cy="580" r="180" fill="#a855f7" opacity=".2" filter="url(#blur)"/>
  <rect x="44" y="42" width="1112" height="596" rx="22" fill="#ffffff" opacity=".08" stroke="#ffffff" stroke-opacity=".22"/>
  <rect x="70" y="70" width="220" height="540" rx="16" fill="#ffffff" opacity=".1"/>
  <text x="100" y="120" fill="#fff" font-family="sans-serif" font-size="24" font-weight="700">PanelForge</text>
  <text x="100" y="175" fill="#cbd5e1" font-family="sans-serif" font-size="15">Overview</text>
  <text x="100" y="220" fill="#94a3b8" font-family="sans-serif" font-size="15">Pipeline</text>
  <text x="100" y="265" fill="#94a3b8" font-family="sans-serif" font-size="15">People</text>
  <rect x="330" y="70" width="800" height="86" rx="16" fill="#ffffff" opacity=".13"/>
  <text x="365" y="112" fill="#a5b4fc" font-family="sans-serif" font-size="13">DECISION SUPPORT</text>
  <text x="365" y="140" fill="#fff" font-family="sans-serif" font-size="25" font-weight="700">Revenue health</text>
  <rect x="330" y="180" width="250" height="120" rx="16" fill="#ffffff" opacity=".13"/>
  <rect x="600" y="180" width="250" height="120" rx="16" fill="#ffffff" opacity=".13"/>
  <rect x="870" y="180" width="260" height="120" rx="16" fill="#ffffff" opacity=".13"/>
  <text x="355" y="216" fill="#cbd5e1" font-family="sans-serif" font-size="14">Qualified pipeline</text>
  <text x="355" y="262" fill="#fff" font-family="sans-serif" font-size="30" font-weight="700">$248k</text>
  <text x="625" y="216" fill="#cbd5e1" font-family="sans-serif" font-size="14">Deals closing soon</text>
  <text x="625" y="262" fill="#fff" font-family="sans-serif" font-size="30" font-weight="700">12</text>
  <text x="895" y="216" fill="#cbd5e1" font-family="sans-serif" font-size="14">Team conversion</text>
  <text x="895" y="262" fill="#fff" font-family="sans-serif" font-size="30" font-weight="700">31.8%</text>
  <rect x="330" y="324" width="500" height="260" rx="16" fill="#ffffff" opacity=".13"/>
  <rect x="850" y="324" width="280" height="260" rx="16" fill="#ffffff" opacity=".13"/>
  <text x="360" y="365" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">Pipeline movement</text>
  <path d="M365 520 C440 470 475 490 535 430 S650 450 710 385 S770 400 795 350" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <text x="880" y="365" fill="#fff" font-family="sans-serif" font-size="19" font-weight="700">Next actions</text>
  <text x="880" y="415" fill="#cbd5e1" font-family="sans-serif" font-size="14">Renewal call</text>
  <text x="880" y="465" fill="#cbd5e1" font-family="sans-serif" font-size="14">Send proposal</text>
  <text x="880" y="515" fill="#cbd5e1" font-family="sans-serif" font-size="14">Review contract</text>
