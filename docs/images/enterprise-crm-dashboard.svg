  <g font-family="sans-serif">
    <rect x="275" y="145" width="275" height="470" rx="16" fill="#e2e8f0"/>
    <rect x="570" y="145" width="275" height="470" rx="16" fill="#e2e8f0"/>
    <rect x="865" y="145" width="275" height="470" rx="16" fill="#e2e8f0"/>
    <text x="300" y="185" fill="#0f172a" font-size="16" font-weight="700">Qualified</text>
    <text x="500" y="185" fill="#64748b" font-size="13">3 · $72k</text>
    <text x="595" y="185" fill="#0f172a" font-size="16" font-weight="700">Proposal</text>
    <text x="795" y="185" fill="#64748b" font-size="13">2 · $84k</text>
    <text x="890" y="185" fill="#0f172a" font-size="16" font-weight="700">Negotiation</text>
    <rect x="295" y="215" width="235" height="110" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <rect x="590" y="215" width="235" height="110" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <rect x="885" y="215" width="235" height="110" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="315" y="250" fill="#0f172a" font-size="16" font-weight="700">Orbit Systems</text>
    <text x="315" y="280" fill="#2563eb" font-size="15" font-weight="700">$31,200</text>
    <text x="610" y="250" fill="#0f172a" font-size="16" font-weight="700">Brightside Health</text>
    <text x="610" y="280" fill="#2563eb" font-size="15" font-weight="700">$52,500</text>
    <text x="905" y="250" fill="#0f172a" font-size="16" font-weight="700">Acme Logistics</text>
    <text x="905" y="280" fill="#2563eb" font-size="15" font-weight="700">$84,000</text>
