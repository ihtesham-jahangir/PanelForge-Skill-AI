<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Enterprise CRM dashboard example</title>
  <desc id="desc">An enterprise CRM pipeline view with dense data tables, status chips, and a kanban board.</desc>
  <rect width="1200" height="680" rx="28" fill="#f1f5f9"/>
  <rect x="0" y="0" width="230" height="680" rx="28" fill="#172033"/>
  <text x="38" y="70" fill="#fff" font-family="sans-serif" font-size="23" font-weight="700">Northstar</text>
  <text x="38" y="125" fill="#94a3b8" font-family="sans-serif" font-size="14">OVERVIEW</text>
  <rect x="25" y="145" width="180" height="42" rx="9" fill="#29446e"/>
  <text x="45" y="172" fill="#fff" font-family="sans-serif" font-size="15">Pipeline</text>
  <text x="38" y="225" fill="#94a3b8" font-family="sans-serif" font-size="15">People</text>
  <text x="38" y="270" fill="#94a3b8" font-family="sans-serif" font-size="15">Activity</text>
  <text x="275" y="70" fill="#0f172a" font-family="sans-serif" font-size="28" font-weight="700">Pipeline</text>
